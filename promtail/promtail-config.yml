server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Caddy access logs
  - job_name: caddy-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          log_type: access
          host: raspberry-pi
          __path__: /var/log/caddy/access.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: ts
            request: request
            status: status
            size: size
            duration: duration
      - timestamp:
          source: timestamp
          format: Unix
      - labels:
          status:
          request:

  # Caddy error logs
  - job_name: caddy-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          log_type: error
          host: raspberry-pi
          __path__: /var/log/caddy/error.log
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\S+)\s+(?P<level>\S+)\s+(?P<message>.*)'
      - labels:
          level:

  # System logs (optional but useful)
  - job_name: syslog
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          host: raspberry-pi
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+?)(\[\d+\])?:\s+(?P<message>.*)'
      - labels:
          hostname:
          service:

  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          host: raspberry-pi
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano