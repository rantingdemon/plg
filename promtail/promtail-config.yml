server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Caddy access logs
  - job_name: caddy-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          log_type: access
          __path__: /var/log/caddy/access.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            request: request
            status: status
            size: size
      - labels:
          level:
          status:
      - timestamp:
          source: ts
          format: Unix

  # Caddy error logs
  - job_name: caddy-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: caddy
          log_type: error
          __path__: /var/log/caddy/error.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            ts: ts
            msg: msg
      - labels:
          level:
      - timestamp:
          source: ts
          format: Unix

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: syslog
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\w+\s+\d+\s+\d+:\d+:\d+)\s+(?P<hostname>\S+)\s+(?P<service>\S+?)(\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
      - labels:
          hostname:
          service:
      - timestamp:
          source: timestamp
          format: Jan 02 15:04:05

  # Docker container logs
  - job_name: docker
    static_configs:
      - targets:
          - localhost
        labels:
          job: docker
          __path__: /var/lib/docker/containers/*/*-json.log
    pipeline_stages:
      - json:
          expressions:
            output: log
            stream: stream
            time: time
      - json:
          expressions:
            tag:
          source: attrs
      - labels:
          stream:
      - timestamp:
          source: time
          format: RFC3339Nano
      - output:
          source: output