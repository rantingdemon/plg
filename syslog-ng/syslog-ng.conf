@version: 4.1
@include "scl.conf"

# Options
options {
    chain_hostnames(off);
    flush_lines(0);
    use_dns(no);
    use_fqdn(no);
    owner("root");
    group("adm");
    perm(0640);
    stats_freq(0);
    bad_hostname("^gconfd$");
    keep_hostname(yes);
};

# Source for UDP syslog (MikroTik default)
source s_mikrotik_udp {
    network(
        transport("udp")
        port(514)
        flags(no-parse)
    );
};

# Source for TCP syslog (optional, more reliable)
source s_mikrotik_tcp {
    network(
        transport("tcp")
        port(514)
        flags(no-parse)
    );
};

# Parser for MikroTik logs
parser p_mikrotik {
    csv-parser(
        columns("PRIORITY", "TIMESTAMP", "HOST", "MESSAGE")
        delimiters(" ")
        flags(greedy, drop-invalid)
    );
};

# Rewrite to format for Loki
rewrite r_format_for_loki {
    set("mikrotik", value("job"));
    set("$HOST", value("hostname"));
};

# Destination: Write to file (for debugging)
destination d_mikrotik_file {
    file("/var/log/syslog-ng/mikrotik.log"
        template("${ISODATE} ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

# Destination: Send to Loki via HTTP
destination d_loki {
    http(
        url("http://loki:3100/loki/api/v1/push")
        method("POST")
        headers("Content-Type: application/json")
        body('{"streams": [{"stream": {"job": "mikrotik", "hostname": "${HOST}", "source": "syslog"}, "values": [["${S_UNIXTIME}000000000", "${MESSAGE}"]]}]}')
        timeout(10)
    );
};

# Log path for MikroTik logs
log {
    source(s_mikrotik_udp);
    source(s_mikrotik_tcp);
    rewrite(r_format_for_loki);
    destination(d_mikrotik_file);
    destination(d_loki);
};