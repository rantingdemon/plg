
@version: 4.5
@include "scl.conf"

# Options
options {
    keep_hostname(yes);
    use_dns(no);
    use_fqdn(no);
    chain_hostnames(no);
    stats_freq(0);
    flush_lines(0);
    threaded(yes);
};

# Sources - receive syslog from MikroTik
source s_network_tcp {
    network(
        transport("tcp")
        port(514)
        flags(no-parse)
    );
};

source s_network_udp {
    network(
        transport("udp")
        port(514)
        flags(no-parse)
    );
};

# Template for JSON output to Loki
template t_json {
    template("$(format-json --scope rfc5424 --scope nv-pairs --exclude DATE --key ISODATE @timestamp=${ISODATE})\n");
    template_escape(no);
};

# Parse MikroTik logs
parser p_mikrotik {
    csv-parser(
        columns("facility", "severity", "timestamp", "hostname", "message")
        delimiters(" ")
        flags(greedy)
    );
};

# Destination - send to Loki via HTTP
destination d_loki {
    http(
        url("http://loki:3100/loki/api/v1/push")
        method("POST")
        headers("Content-Type: application/json")
        body('{"streams": [{"stream": {"job": "syslog", "source": "mikrotik", "hostname": "${HOST}"}, "values": [["${S_UNIXTIME}000000000", "${MESSAGE}"]]}]}')
    );
};

# File destination for debugging
destination d_mikrotik_file {
    file("/var/log/syslog-ng/mikrotik.log"
        template("${ISODATE} ${HOST} ${MESSAGE}\n")
        create_dirs(yes)
    );
};

# Log path
log {
    source(s_network_tcp);
    source(s_network_udp);
    parser(p_mikrotik);
    destination(d_loki);
    destination(d_mikrotik_file);
};