global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'raspberry-pi-monitor'

# Alertmanager configuration (optional - uncomment if you set up alertmanager)
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets:
#           - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  # - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'prometheus'

  # Raspberry Pi host metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'raspberry-pi'
          host: 'raspberry-pi'

  # Docker container metrics
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'raspberry-pi-docker'

  # Grafana metrics
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'grafana'

  # Loki metrics
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']
        labels:
          instance: 'loki'

  # Add your Caddy exporter here if you install one
  # - job_name: 'caddy'
  #   static_configs:
  #     - targets: ['host.docker.internal:2019']
  #       labels:
  #         instance: 'caddy'